# Bootstrap HTTP, only while provisioning TLS and before user login.
server {
    listen 80;
    server_name @@DOMAIN@@;
    root /opt/folio/current/frontend;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        # Support notifications use SSE; flush events promptly.
        proxy_buffering off; return 503; }
    location /ws/ { return 503; }
    location /storage/ { return 503; }
}
