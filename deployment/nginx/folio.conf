# Private TLS files are outside the web root.
server {
    listen 80;
    server_name @@DOMAIN@@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name @@DOMAIN@@;
    root /opt/folio/current/frontend;
    index index.html;
    ssl_certificate /etc/folio/tls/@@DOMAIN@@.pem;
    ssl_certificate_key /etc/folio/tls/@@DOMAIN@@.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        # Support notifications use SSE; flush events promptly.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Must pass FastAPI authentication and ownership checks, never alias to disk.
    location /storage/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://127.0.0.1:8000; }
}
